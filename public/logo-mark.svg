<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Fixit">
  <defs>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e0ff"/>
      <stop offset="50%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#ff3df0"/>
    </linearGradient>
    <linearGradient id="r2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3df0"/>
      <stop offset="50%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#22e0ff"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="80" height="80" rx="16" fill="#05050a"/>
  <g transform="translate(40 40)" filter="url(#g)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-22)" stroke="url(#r1)" stroke-width="1.8">
      <rect x="-12" y="-20" width="24" height="40" rx="4.5"/>
    </g>
    <g stroke-width="2.2">
      <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(28)" stroke="url(#r1)"/>
      <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(-28)" stroke="url(#r2)"/>
    </g>
  </g>
</svg>
