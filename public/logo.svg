<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Fixit Repair Express">
  <defs>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e0ff"/>
      <stop offset="50%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#ff3df0"/>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3df0"/>
      <stop offset="50%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#22e0ff"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22e0ff"/>
      <stop offset="55%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#ff3df0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(360 130)" filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-22)" stroke="url(#phoneGrad)" stroke-width="6">
      <rect x="-50" y="-86" width="100" height="172" rx="18"/>
      <line x1="-14" y1="-72" x2="14" y2="-72" stroke-width="5"/>
      <line x1="-12" y1="74" x2="12" y2="74" stroke-width="5"/>
    </g>
    <g stroke-width="7">
      <ellipse cx="0" cy="0" rx="130" ry="52" transform="rotate(28)" stroke="url(#ringA)"/>
      <ellipse cx="0" cy="0" rx="130" ry="52" transform="rotate(-28)" stroke="url(#ringB)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Space Grotesk', Inter, sans-serif" text-anchor="middle">
    <text x="360" y="260" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="4">FIXIT REPAIR</text>
    <text x="360" y="298" font-size="20" font-weight="600" fill="#22e0ff" letter-spacing="12">EXPRESS</text>
  </g>
</svg>
