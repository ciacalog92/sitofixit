<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Fixit Repair Express">
  <defs>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22e0ff"/>
      <stop offset="50%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#ff3df0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="200" fill="#05050a"/>
  <g filter="url(#glow)" stroke="url(#neonGrad)" stroke-width="3" fill="none">
    <path d="M52 60 l28 -16 l28 16 v80 l-28 16 l-28 -16 z"/>
    <path d="M80 44 v112"/>
    <path d="M52 100 h56"/>
  </g>
  <g font-family="'Space Grotesk', Inter, sans-serif" font-weight="700" filter="url(#glow)">
    <text x="140" y="108" font-size="64" fill="url(#neonGrad)" letter-spacing="2">FIXIT</text>
    <text x="140" y="148" font-size="22" fill="#22e0ff" letter-spacing="6">REPAIR EXPRESS</text>
  </g>
</svg>
